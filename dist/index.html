<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>绿茵对决 · 足球游戏</title>
    <style>
/* =================================================================
   main.css — 游戏全局样式
   绿茵对决 · 足球游戏
   涵盖场地、记分牌、菜单面板、世界杯封面动画、移动端适配
   ================================================================= */

/* --- 重置与基础 --- */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    height: 100%;
    overflow: hidden;
    background: #0a1a0a;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #fff;
    -webkit-user-select: none;
    user-select: none;
    touch-action: none;
}

/* --- 画布容器 --- */
#wrap {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
}

canvas {
    display: block;
    background: #2d8a2d;
    box-shadow: 0 0 40px rgba(0,0,0,.6);
    max-width: 100%;
    max-height: 100%;
}

/* --- 记分牌 --- */
#hud {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    pointer-events: none;
    z-index: 5;
}

#scoreboard {
    background: rgba(0,0,0,.65);
    border-radius: 0 0 14px 14px;
    padding: 8px 22px;
    display: flex;
    align-items: center;
    gap: 14px;
    font-variant-numeric: tabular-nums;
}

#scoreboard .team {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 18px;
    font-weight: 700;
}

#scoreboard .dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
}

#scoreboard .red  { background: #e63946; }
#scoreboard .blue { background: #3a86ff; }

#scoreboard .score {
    font-size: 28px;
    font-weight: 800;
    min-width: 34px;
    text-align: center;
}

#scoreboard .vs {
    color: #888;
    font-size: 14px;
}

#scoreboard .time {
    margin-left: 8px;
    padding-left: 14px;
    border-left: 1px solid #444;
    font-size: 18px;
    font-weight: 700;
    color: #ffd60a;
    min-width: 60px;
    text-align: center;
}

/* --- 弹出消息 --- */
#msg {
    position: absolute;
    top: 42%;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 54px;
    font-weight: 900;
    color: #ffd60a;
    text-shadow: 0 4px 20px rgba(0,0,0,.8);
    z-index: 7;
    pointer-events: none;
    opacity: 0;
    transition: opacity .3s;
}

#msg.show {
    opacity: 1;
    animation: pop .5s;
}

@keyframes pop {
    0%   { transform: scale(.3); }
    60%  { transform: scale(1.15); }
    100% { transform: scale(1); }
}

/* --- 当前控制球员名 --- */
#activeName {
    position: absolute;
    top: 54px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 14px;
    color: #ffd60a;
    font-weight: 700;
    z-index: 5;
    pointer-events: none;
    text-shadow: 0 2px 6px rgba(0,0,0,.9);
}

/* --- 调试按钮 --- */
#btnDebug {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: rgba(20,20,20,.8);
    color: #ffd60a;
    border: 1px solid #555;
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
    z-index: 8;
    display: none;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(4px);
}

#btnDebug:active { transform: scale(.9); }

/* --- 菜单遮罩 --- */
#overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(5,15,5,.82);
    z-index: 10;
    backdrop-filter: blur(4px);
}

#overlay.hidden { display: none; }

/* --- 菜单面板 --- */
.panel {
    text-align: center;
    max-width: 520px;
    padding: 30px;
}

.panel h1 {
    font-size: 42px;
    margin-bottom: 6px;
    background: linear-gradient(90deg, #ffd60a, #e63946);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}

.panel .tag {
    color: #8aff8a;
    font-size: 14px;
    margin-bottom: 24px;
    letter-spacing: 2px;
}

.panel p {
    font-size: 15px;
    color: #bbb;
    line-height: 1.7;
    margin-bottom: 18px;
}

.panel .keys {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px 18px;
    margin: 18px 0;
    text-align: left;
    font-size: 13px;
    color: #ccc;
}

.panel .keys b {
    display: inline-block;
    background: #222;
    border: 1px solid #444;
    border-radius: 5px;
    padding: 2px 8px;
    margin-right: 6px;
    font-family: monospace;
    color: #ffd60a;
    min-width: 30px;
    text-align: center;
}

/* --- 按钮 --- */
.btn {
    border: none;
    padding: 14px 36px;
    font-size: 18px;
    font-weight: 700;
    border-radius: 30px;
    cursor: pointer;
    margin: 6px;
    transition: transform .1s;
}

.btn:active { transform: scale(.95); }

.btn-primary {
    background: linear-gradient(135deg, #e63946, #b81d2a);
    color: #fff;
    box-shadow: 0 6px 20px rgba(230,57,70,.4);
}

.btn-secondary {
    background: linear-gradient(135deg, #3a86ff, #1565c0);
    color: #fff;
    box-shadow: 0 6px 20px rgba(58,134,255,.4);
}

.btn-ghost {
    background: transparent;
    border: 1px solid #555;
    color: #ccc;
}

.btn-ghost:hover { background: #2c2c2c; }

.btns {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 8px;
}

.big {
    font-size: 64px;
    font-weight: 900;
    margin: 10px 0;
}

.big.red  { color: #e63946; }
.big.blue { color: #3a86ff; }
.big.draw { color: #ffd60a; }

/* --- 选择器 --- */
.sel-group  { margin: 8px 0; }
.sel-label  { font-size: 12px; color: #888; margin-bottom: 6px; }

.sel-btns {
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
}

.chip {
    background: #222;
    border: 1px solid #444;
    color: #ccc;
    padding: 7px 16px;
    border-radius: 18px;
    font-size: 13px;
    cursor: pointer;
    transition: all .12s;
}

.chip.active {
    background: #e63946;
    border-color: #e63946;
    color: #fff;
}

.chip:active { transform: scale(.95); }

/* --- 对阵预览 --- */
.matchup {
    font-size: 15px;
    font-weight: 700;
    margin: 10px 0;
    letter-spacing: .5px;
}

/* --- 俱乐部选择网格 --- */
.club-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
    margin: 8px 0;
}

.club-chip {
    background: #1a1a1a;
    border: 1px solid #333;
    color: #ccc;
    padding: 8px 4px;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
    transition: all .15s;
    text-align: center;
}

.club-chip:hover {
    background: #252525;
    border-color: #555;
    color: #fff;
}

.club-chip.selected {
    background: linear-gradient(135deg, #ffd60a, #ff8c00);
    color: #222;
    border-color: transparent;
    font-weight: 700;
    box-shadow: 0 0 10px rgba(255,214,10,.4);
}

/* --- 移动端触控 --- */
#mctrl {
    position: absolute;
    inset: 0;
    z-index: 6;
    pointer-events: none;
    display: none;
}

#mctrl.show { display: block; }

#stick {
    position: absolute;
    left: 24px;
    bottom: 24px;
    width: 130px;
    height: 130px;
    border-radius: 50%;
    background: rgba(255,255,255,.08);
    border: 2px solid rgba(255,255,255,.2);
    pointer-events: auto;
}

#stickKnob {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: rgba(255,255,255,.4);
    transform: translate(-50%, -50%);
    pointer-events: none;
}

#mbtns {
    position: absolute;
    right: 24px;
    bottom: 30px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    pointer-events: none;
}

#mbtns button {
    width: 78px;
    height: 78px;
    border-radius: 50%;
    border: none;
    font-size: 15px;
    font-weight: 800;
    color: #fff;
    pointer-events: auto;
    box-shadow: 0 4px 14px rgba(0,0,0,.4);
}

#mbtns button:active { transform: scale(.9); }

#btnPass   { background: rgba(58,134,255,.85); }
#btnShoot  { background: rgba(230,57,70,.85); }
#btnSprint { background: rgba(255,214,10,.85); color: #222; }
#btnTackle { background: rgba(40,40,40,.85); color: #fff; border: 1px solid #888; }

/* --- 点球 HUD --- */
#penHUD {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 14px;
    display: flex;
    justify-content: center;
    gap: 10px;
    z-index: 6;
    pointer-events: none;
}

.pen-row {
    display: flex;
    gap: 5px;
    align-items: center;
}

.pen-dot {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,.3);
    background: transparent;
}

.pen-dot.in  { background: #2e7d32; border-color: #2e7d32; }
.pen-dot.out { background: #c62828; border-color: #c62828; }

.pen-label {
    font-size: 13px;
    font-weight: 700;
    margin: 0 4px;
}

.small {
    font-size: 12px;
    color: #666;
    margin-top: 18px;
}

/* =================================================================
   世界杯模式样式
   ================================================================= */

/* --- 球队选择 --- */
.wc-teams {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    justify-content: center;
    margin: 6px 0 12px;
}

.wc-pot-label {
    font-size: 12px;
    color: #ffd60a;
    letter-spacing: 1px;
    text-align: left;
    margin-top: 8px;
}

.wc-team {
    background: #222;
    border: 1px solid #444;
    color: #ddd;
    padding: 6px 10px;
    border-radius: 16px;
    font-size: 12px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    transition: all .12s;
}

.wc-team:hover { background: #333; border-color: #ffd60a; }
.wc-team:active { transform: scale(.95); }

.wc-team .wc-rating {
    background: #ffd60a;
    color: #222;
    font-weight: 800;
    font-size: 10px;
    padding: 1px 5px;
    border-radius: 8px;
}

/* --- 小组表格 --- */
.wc-groups {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px,1fr));
    gap: 8px;
    margin: 8px 0;
}

.wc-group {
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 8px;
    text-align: left;
}

.wc-group-user {
    border-color: #ffd60a;
    box-shadow: 0 0 10px rgba(255,214,10,.3);
}

.wc-group-name {
    font-size: 13px;
    font-weight: 800;
    color: #ffd60a;
    margin-bottom: 5px;
    letter-spacing: 1px;
}

.wc-gt     { font-size: 12px; color: #ccc; padding: 2px 0; }
.wc-gt-user { color: #fff; font-weight: 800; }

.wc-group-mini {
    font-size: 11px;
    color: #999;
    padding: 3px 0;
    border-bottom: 1px solid #2a2a2a;
}

.wc-other-groups { margin: 8px 0; text-align: left; }

/* --- 积分表 --- */
.wc-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
    margin: 8px 0;
}

.wc-table th {
    background: #222;
    color: #ffd60a;
    padding: 5px 3px;
    font-weight: 700;
    border-bottom: 1px solid #444;
    font-size: 11px;
}

.wc-table td {
    padding: 4px 3px;
    border-bottom: 1px solid #2a2a2a;
    color: #ddd;
}

.wc-row-user { background: rgba(255,214,10,.12); }
.wc-row-user td { color: #fff; font-weight: 700; }

/* --- 赛程 --- */
.wc-fixtures { margin: 10px 0; text-align: left; }

.wc-fix {
    font-size: 13px;
    color: #ccc;
    padding: 5px 8px;
    background: #1a1a1a;
    border-radius: 6px;
    margin: 3px 0;
}

.wc-fix-user {
    background: rgba(255,214,10,.15);
    color: #fff;
    font-weight: 700;
    border-left: 3px solid #ffd60a;
}

/* --- 淘汰赛对阵 --- */
.wc-bracket {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin: 8px 0;
}

.wc-ko-round {
    grid-column: 1 / -1;
    font-size: 14px;
    font-weight: 800;
    color: #ffd60a;
    text-align: center;
    margin-bottom: 4px;
}

.wc-kmatch {
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 6px;
    padding: 6px 10px;
    text-align: left;
    font-size: 13px;
}

.wc-kmatch-user {
    border-color: #ffd60a;
    box-shadow: 0 0 8px rgba(255,214,10,.3);
}

.wc-kmatch div { padding: 2px 0; color: #ccc; }
.wc-win { color: #7CFC00 !important; font-weight: 800; }

.wc-trophy { margin: 18px 0; text-align: center; }
.wc-scroll { max-height: 62vh; overflow-y: auto; padding: 0 4px; }

/* =================================================================
   世界杯封面动画
   ================================================================= */

.wc-cover {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 9000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    overflow: hidden;
    background: radial-gradient(ellipse at center, #0a1e3a 0%, #000814 70%);
    transition: opacity .6s;
}

.wc-cover-bg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    opacity: .12;
    background:
        repeating-linear-gradient(90deg, transparent 0, transparent 49%, rgba(255,255,255,.15) 49%, rgba(255,255,255,.15) 51%),
        radial-gradient(circle at 50% 50%, transparent 0, transparent 68px, rgba(255,255,255,.4) 68px, rgba(255,255,255,.4) 70px, transparent 70px);
}

.wc-cover-lights {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    background:
        radial-gradient(circle at 25% 20%, rgba(255,214,10,.06) 0%, transparent 35%),
        radial-gradient(circle at 75% 25%, rgba(58,134,255,.06) 0%, transparent 35%),
        radial-gradient(circle at 50% 80%, rgba(230,57,70,.06) 0%, transparent 40%);
    animation: wcLights 3s ease-in-out infinite alternate;
}

@keyframes wcLights {
    0%   { opacity: .6; }
    100% { opacity: 1; }
}

.wc-cover-2026 {
    font-size: 84px;
    font-weight: 900;
    color: #ffd60a;
    letter-spacing: 6px;
    line-height: 1;
    text-shadow: 0 0 30px rgba(255,214,10,.6), 0 0 70px rgba(255,214,10,.3), 0 4px 8px rgba(0,0,0,.5);
    animation: wcZoom 1.2s cubic-bezier(.18,.89,.32,1.28) both;
}

@keyframes wcZoom {
    0%   { transform: scale(0) rotate(-10deg); opacity: 0; }
    60%  { transform: scale(1.15) rotate(2deg); opacity: 1; }
    100% { transform: scale(1) rotate(0); opacity: 1; }
}

.wc-cover-sub {
    font-size: 14px;
    color: #3a86ff;
    letter-spacing: 4px;
    margin-top: 2px;
    font-weight: 600;
    animation: wcFade 1s ease-out .6s both;
}

.wc-cover-title {
    font-size: 30px;
    font-weight: 800;
    color: #fff;
    letter-spacing: 10px;
    margin-top: 6px;
    animation: wcSlide 1s ease-out .8s both;
    text-shadow: 0 2px 10px rgba(0,0,0,.8);
}

@keyframes wcSlide {
    0%   { transform: translateY(40px); opacity: 0; letter-spacing: 0; }
    100% { transform: translateY(0); opacity: 1; letter-spacing: 10px; }
}

.wc-cover-hosts {
    font-size: 17px;
    color: #ccc;
    margin-top: 14px;
    animation: wcFade 1s ease-out 1.2s both;
}

.wc-cover-trophy {
    font-size: 80px;
    margin: 28px 0 8px;
    animation: wcBounce 1s cubic-bezier(.18,.89,.32,1.28) 1.5s both,
               wcTrophyGlow 2.5s ease-in-out 2.5s infinite;
    line-height: 1;
}

@keyframes wcBounce {
    0%   { transform: translateY(-120px) scale(0) rotate(-30deg); opacity: 0; }
    60%  { transform: translateY(15px) scale(1.3) rotate(5deg); opacity: 1; }
    100% { transform: translateY(0) scale(1) rotate(0); opacity: 1; }
}

@keyframes wcTrophyGlow {
    0%, 100% { filter: drop-shadow(0 0 12px rgba(255,214,10,.4)); }
    50%      { filter: drop-shadow(0 0 35px rgba(255,214,10,.8)); }
}

@keyframes wcFade {
    0%   { opacity: 0; transform: translateY(10px); }
    100% { opacity: 1; transform: translateY(0); }
}

.wc-cover-continue {
    font-size: 13px;
    color: #555;
    margin-top: 24px;
    animation: wcFade 1s ease-out 2.8s both,
               wcBlink 1.5s ease-in-out 3.8s infinite;
}

@keyframes wcBlink {
    0%, 100% { opacity: .3; }
    50%      { opacity: .9; }
}

.wc-confetti {
    position: absolute;
    top: -20px;
    animation: wcFall linear infinite;
    pointer-events: none;
}

@keyframes wcFall {
    0%   { transform: translateY(-20px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(105vh) rotate(720deg); opacity: .4; }
}

.wc-cover-vs {
    display: flex;
    gap: 18px;
    margin-top: 6px;
    animation: wcFade .8s ease-out 2s both;
}

.wc-cover-vs span {
    font-size: 22px;
    filter: drop-shadow(0 0 6px rgba(255,255,255,.2));
}

/* =================================================================
   响应式
   ================================================================= */

@media (max-width: 600px) {
    .club-grid { grid-template-columns: repeat(3, 1fr); gap: 5px; }
    .club-chip { font-size: 11px; padding: 7px 3px; }
    .wc-cover-2026  { font-size: 56px; letter-spacing: 4px; }
    .wc-cover-title { font-size: 22px; letter-spacing: 6px; }
    .wc-cover-trophy { font-size: 60px; }
    .wc-cover-hosts { font-size: 14px; }
}

</style>
</head>
<body>
<div id="wrap">
    <canvas id="cv"></canvas>

    <div id="hud">
        <div id="scoreboard">
            <div class="team"><span class="dot red"></span><span id="redName">红队</span><span class="score" id="sRed">0</span></div>
            <span class="vs">VS</span>
            <div class="team"><span class="score" id="sBlue">0</span><span id="blueName">蓝队</span><span class="dot blue"></span></div>
            <div class="time" id="sTime">1:30</div>
        </div>
    </div>

    <div id="msg"></div>
    <div id="penHUD" style="display:none"></div>
    <div id="activeName"></div>
    <button id="btnDebug" title="重置比赛（调试）">↻</button>

    <div id="mctrl">
        <div id="stick"><div id="stickKnob"></div></div>
        <div id="mbtns">
            <button id="btnPass">长传</button>
            <button id="btnShoot">射门</button>
            <button id="btnTackle">铲断</button>
            <button id="btnSprint">疾跑</button>
        </div>
    </div>

    <div id="overlay">
        <div class="panel" id="panel">
            <!-- 面板由 JS 动态渲染 -->
        </div>
    </div>
</div>

<script>
(() => {
'use strict';

// =================================================================
// 00-constants.js — 场地参数、缩放、全局状态 & 工具函数
// 绿茵对决 · 足球游戏
// =================================================================

// --- 画布 & 场地尺寸 ---
const FW = 1450, FH = 920;
const SX = FW / 900, SY = FH / 560;   // 阵型/AI 坐标基于 900×560 设计，按实际场地缩放
const GOAL_H = 220;                    // 球门高度
const GOAL_D = 24;                     // 球门纵深
const WALL = 12;                       // 边线外间距
const GRAVITY = 28;                    // z 轴重力加速度
const BALL_BOUNCE = 0.55;              // 地面反弹系数
let scale = 1;

// --- 队伍常量 ---
const TEAM_RED = 0, TEAM_BLUE = 1;

// --- 画布 ---
const cv = document.getElementById('cv') as HTMLCanvasElement;
const ctx = cv.getContext('2d')!;

// --- 比赛模式状态 ---
let mode = 'match';          // 'match' | 'penalty'
let state = 'menu';
let score = [0, 0];
let matchTime = 90;          // 比赛时长（秒），菜单可选
let timer = matchTime;
let lastT = 0;

// 01-camera.js — 电视转播视角投影 & 镜头跟随
// 绿茵对决 · 足球游戏
//
// 模拟摄像机从球场一侧高处斜视，带透视压缩效果。
// project() 把世界坐标 → 屏幕坐标，返回深度缩放比 dscale。
// =================================================================

const CAM_TILT = 0.48;       // y 压缩比（越低越侧视，转播视角 0.45~0.55）
const CAM_OFFSET_Y = 90;     // 顶部留白
const PERSP = 0.00038;       // 透视强度：远端 x 向中心压缩
let camPanX = 0;             // 镜头水平偏移，跟随球
let canvasOffsetX = 0, canvasOffsetY = 0;

// 屏幕偏移量（供渲染器读取）
let screenOX = 0, screenOY = 0;

/**
 * 世界坐标 → 屏幕坐标
 * @param {number} x - 世界 x (0 ~ FW)
 * @param {number} y - 世界 y (0 ~ FH)
 * @param {number} z - 高度（用于 z 轴偏移）
 * @returns {{ sx: number, sy: number, depth: number, dscale: number }}
 *   dscale 表示深度缩放比（远端 ≈0.82，近端 ≈1.0），渲染时乘以此值得到透视正确的大小
 */
function project(x, y, z = 0) {
    const dscale = 1 - (FH * 0.5 - y) * PERSP;
    const cx = FW / 2 + camPanX;
    const sx = cx + (x - cx) * dscale;
    const sy = y * CAM_TILT + CAM_OFFSET_Y - z * (1 - CAM_TILT) * 0.8;
    return { sx, sy, depth: y, dscale };
}

// 窗口 resize：自适应窗口，优先适配宽度
function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const W = window.innerWidth, H = window.innerHeight;
    const visH = FH * CAM_TILT + CAM_OFFSET_Y + 30;
    scale = Math.min(W / FW, H / visH);
    canvasOffsetX = (W - FW * scale) / 2;
    canvasOffsetY = (H - visH * scale) / 2;
    cv.width = W * dpr;
    cv.height = H * dpr;
    cv.style.width = W + 'px';
    cv.style.height = H + 'px';
    ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * canvasOffsetX, dpr * canvasOffsetY);
    screenOX = canvasOffsetX;
    screenOY = canvasOffsetY;
}

window.addEventListener('resize', resize);
resize();

// 镜头平滑跟随球
function updateCamera(dt) {
    const target = clamp((ball.x - FW / 2) * 0.25, -FW * 0.12, FW * 0.12);
    camPanX += (target - camPanX) * Math.min(1, dt * 2.5);
}

let audioCtx: AudioContext | null = null;

function getAudio(): AudioContext {
    if (!audioCtx) audioCtx = new AudioContext();
    return audioCtx;
}

// --- 单次哨声（裁判用） ---
function playSingleWhistle(start, dur, vol) {
    const ac = getAudio();
    const o1 = ac.createOscillator(), o2 = ac.createOscillator(), g = ac.createGain();
    o1.type = 'square'; o2.type = 'sawtooth';
    o1.frequency.setValueAtTime(2600, start);
    o2.frequency.setValueAtTime(3100, start);
    const lfo = ac.createOscillator(), lfoG = ac.createGain();
    lfo.frequency.value = 22; lfoG.gain.value = 180;
    lfo.connect(lfoG); lfoG.connect(o1.frequency); lfoG.connect(o2.frequency);
    g.gain.setValueAtTime(0, start);
    g.gain.linearRampToValueAtTime(vol, start + 0.03);
    g.gain.linearRampToValueAtTime(vol * 0.85, start + dur * 0.7);
    g.gain.linearRampToValueAtTime(0, start + dur);
    o1.connect(g); o2.connect(g); g.connect(ac.destination);
    o1.start(start); o2.start(start); lfo.start(start);
    o1.stop(start + dur); o2.stop(start + dur); lfo.stop(start + dur);
}

// 裁判哨声：高频振荡 + 颤音
function playWhistle() {
    try {
        const ac = getAudio();
        const t = ac.currentTime;
        const dur = 0.45;
        const o1 = ac.createOscillator(), o2 = ac.createOscillator();
        const g = ac.createGain();
        o1.type = 'square'; o2.type = 'sawtooth';
        o1.frequency.setValueAtTime(2600, t);
        o2.frequency.setValueAtTime(3100, t);
        const lfo = ac.createOscillator(), lfoGain = ac.createGain();
        lfo.frequency.value = 22; lfoGain.gain.value = 180;
        lfo.connect(lfoGain); lfoGain.connect(o1.frequency); lfoGain.connect(o2.frequency);
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(0.18, t + 0.03);
        g.gain.linearRampToValueAtTime(0.15, t + dur * 0.7);
        g.gain.linearRampToValueAtTime(0, t + dur);
        o1.connect(g); o2.connect(g); g.connect(ac.destination);
        o1.start(t); o2.start(t); lfo.start(t);
        o1.stop(t + dur); o2.stop(t + dur); lfo.stop(t + dur);
    } catch (e) { /* 静默处理 */ }
}

// 出牌哨声：黄牌两声短哨，红牌三声急促长哨
function playCardWhistle(color) {
    try {
        const ac = getAudio();
        const now = ac.currentTime;
        if (color === 'red') {
            playSingleWhistle(now, 0.55, 0.20);
            playSingleWhistle(now + 0.70, 0.50, 0.18);
            playSingleWhistle(now + 1.35, 0.65, 0.22);
        } else {
            playSingleWhistle(now, 0.30, 0.16);
            playSingleWhistle(now + 0.45, 0.35, 0.16);
        }
    } catch (e) { /* 静默处理 */ }
}

// =================================================================
// 观众音效系统
// =================================================================

let crowdNoiseNode = null;    // 背景噪声源
let crowdNoiseGain = null;   // 背景噪声增益节点

// 背景人群嗡嗡声（比赛开始时启动）
function startCrowdAmbience() {
    try {
        if (crowdNoiseNode) return;
        const ac = getAudio();
        const bufferSize = ac.sampleRate * 2;
        const buffer = ac.createBuffer(1, bufferSize, ac.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        const noise = ac.createBufferSource();
        noise.buffer = buffer; noise.loop = true;
        const bp = ac.createBiquadFilter();
        bp.type = 'bandpass'; bp.frequency.value = 400; bp.Q.value = 0.6;
        const lp = ac.createBiquadFilter();
        lp.type = 'lowpass'; lp.frequency.value = 800;
        crowdNoiseGain = ac.createGain();
        crowdNoiseGain.gain.value = 0.04;
        noise.connect(bp); bp.connect(lp); lp.connect(crowdNoiseGain);
        crowdNoiseGain.connect(ac.destination);
        noise.start();
        crowdNoiseNode = noise;
    } catch (e) { /* 静默处理 */ }
}

function stopCrowdAmbience() {
    try {
        if (crowdNoiseNode) { crowdNoiseNode.stop(); crowdNoiseNode = null; crowdNoiseGain = null; }
    } catch (e) { /* 静默处理 */ }
}

// 进球欢呼：白噪声爆发 + 上升包络
function playCrowdCheer(intensity = 1.0, duration = 2.5) {
    try {
        const ac = getAudio();
        const t = ac.currentTime;
        const bufferSize = ac.sampleRate * duration;
        const buffer = ac.createBuffer(1, bufferSize, ac.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
            const env = Math.min(1, i / (ac.sampleRate * 0.3));
            data[i] = (Math.random() * 2 - 1) * env;
        }
        const noise = ac.createBufferSource();
        noise.buffer = buffer;
        const bp = ac.createBiquadFilter();
        bp.type = 'bandpass'; bp.frequency.value = 1200; bp.Q.value = 0.8;
        const hp = ac.createBiquadFilter();
        hp.type = 'highpass'; hp.frequency.value = 300;
        const g = ac.createGain();
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(0.15 * intensity, t + 0.25);
        g.gain.linearRampToValueAtTime(0.12 * intensity, t + duration * 0.5);
        g.gain.linearRampToValueAtTime(0.06 * intensity, t + duration * 0.75);
        g.gain.linearRampToValueAtTime(0, t + duration);
        noise.connect(bp); bp.connect(hp); hp.connect(g); g.connect(ac.destination);
        noise.start(t); noise.stop(t + duration);
        if (crowdNoiseGain) {
            crowdNoiseGain.gain.cancelScheduledValues(t);
            crowdNoiseGain.gain.setValueAtTime(crowdNoiseGain.gain.value, t);
            crowdNoiseGain.gain.linearRampToValueAtTime(0.10 * intensity, t + 0.2);
            crowdNoiseGain.gain.linearRampToValueAtTime(0.04, t + duration);
        }
    } catch (e) { /* 静默处理 */ }
}

// 嘘声/惊叹（犯规、失误）
function playCrowdGroan(duration = 0.8) {
    try {
        const ac = getAudio();
        const t = ac.currentTime;
        const bufferSize = ac.sampleRate * duration;
        const buffer = ac.createBuffer(1, bufferSize, ac.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        const noise = ac.createBufferSource();
        noise.buffer = buffer;
        const lp = ac.createBiquadFilter();
        lp.type = 'lowpass'; lp.frequency.value = 500;
        const g = ac.createGain();
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(0.10, t + 0.1);
        g.gain.linearRampToValueAtTime(0.07, t + duration * 0.6);
        g.gain.linearRampToValueAtTime(0, t + duration);
        noise.connect(lp); lp.connect(g); g.connect(ac.destination);
        noise.start(t); noise.stop(t + duration);
    } catch (e) { /* 静默处理 */ }
}

// 鼓掌（精彩拼抢、扑救）
function playCrowdClap(duration = 1.2) {
    try {
        const ac = getAudio();
        const t = ac.currentTime;
        const clapCount = Math.floor(duration / 0.12);
        for (let i = 0; i < clapCount; i++) {
            const ct = t + i * 0.12;
            const o = ac.createOscillator();
            const g = ac.createGain();
            o.type = 'square'; o.frequency.value = 200 + Math.random() * 100;
            g.gain.setValueAtTime(0.06, ct);
            g.gain.exponentialRampToValueAtTime(0.001, ct + 0.06);
            o.connect(g); g.connect(ac.destination);
            o.start(ct); o.stop(ct + 0.06);
        }
    } catch (e) { /* 静默处理 */ }
}

const keys = {};

// 键盘事件
window.addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    keys[k] = true;
    if ([' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(k)) {
        e.preventDefault();
    }
    // 比赛模式按键
    if (mode === 'match') {
        if (k === 'x') switchPlayer();
        if (k === 'p' && (state === 'playing' || state === 'paused')) {
            state = state === 'playing' ? 'paused' : 'playing';
        }
        if (replayActive && (k === ' ' || k === 'enter')) skipReplay();
    } else if (mode === 'penalty') {
        if (k === ' ' && penState === 'aim') lockPenShot();
    }
});

window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

// 读取移动输入（键盘 + 摇杆）
function readMove() {
    let x = 0, y = 0;
    if (keys['arrowleft'] || keys['a']) x -= 1;
    if (keys['arrowright'] || keys['d']) x += 1;
    if (keys['arrowup'] || keys['w']) y -= 1;
    if (keys['arrowdown'] || keys['s']) y += 1;
    x += stick.dx; y += stick.dy;
    const m = Math.hypot(x, y);
    if (m > 1) { x /= m; y /= m; }
    return { x, y };
}

// 切换控制球员（红队非门将中离球最近的）
function switchPlayer() {
    let best = -1, bd = 1e9;
    players.forEach((p, i) => {
        if (p.team === TEAM_RED && !p.gk && i !== activeIdx) {
            const d = dist(p, ball);
            if (d < bd) { bd = d; best = i; }
        }
    });
    if (best >= 0) activeIdx = best;
}

// --- 触屏摇杆 ---
const stick = { dx: 0, dy: 0, active: false, id: 0, cx: 0, cy: 0 };
const stickEl = document.getElementById('stick');
const knobEl = document.getElementById('stickKnob');

function stickStart(e) {
    stick.active = true;
    const r = stickEl.getBoundingClientRect();
    stick.cx = r.left + r.width / 2;
    stick.cy = r.top + r.height / 2;
    stick.id = e.pointerId || 0;
    stickMove(e);
}

function stickMove(e) {
    if (!stick.active) return;
    let dx = e.clientX - stick.cx, dy = e.clientY - stick.cy;
    const R = 50, m = Math.hypot(dx, dy);
    if (m > R) { dx = dx / m * R; dy = dy / m * R; }
    stick.dx = dx / R; stick.dy = dy / R;
    knobEl.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
}

function stickEnd() {
    stick.active = false; stick.dx = 0; stick.dy = 0;
    knobEl.style.transform = 'translate(-50%,-50%)';
}

stickEl.addEventListener('pointerdown', stickStart);
window.addEventListener('pointermove', stickMove);
window.addEventListener('pointerup', stickEnd);
window.addEventListener('pointercancel', stickEnd);
