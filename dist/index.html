            }
        }
    }
    stadiumCrowd = arr;
}

// --- LED 广告牌 ---
const AD_LED_TEXTS = [
    'GOLEOBO', 'SPORT+ LIVE', 'UEFA CHAMPIONS', 'FAIR PLAY', 'GOAL!!!',
    'WORLD CUP 2026', 'PRO LEAGUE', 'DREAM TEAM', 'VICTORY', 'SOCCER LIVE',
    'PREMIER LEAGUE', 'CHAMPIONS LEAGUE', 'FOOTBALL', 'STAR PLAYERS', 'ELITE SPORT'
];
const AD_LED_COLORS = ['#ff3333', '#33ff33', '#3399ff', '#ffcc00', '#ff66cc', '#00ffcc', '#ff6600', '#cc33ff'];
let adData = null;

function initAds() {
    adData = [];
    const countPerSide = 12;
    // 远端
    for (let i = 0; i < countPerSide; i++) {
        const w = FW / countPerSide;
        adData.push({
            x: i * w + w / 2, y: -24, w: w * 0.9, h: 16,
            text: AD_LED_TEXTS[(i + Math.floor(Math.random() * AD_LED_TEXTS.length)) % AD_LED_TEXTS.length],
            bg: AD_LED_COLORS[i % AD_LED_COLORS.length],
            side: 'far', index: i, glowColor: AD_LED_COLORS[i % AD_LED_COLORS.length]
        });
    }
    // 近端
    for (let i = 0; i < countPerSide; i++) {
        const w = FW / countPerSide;
        adData.push({
            x: i * w + w / 2, y: FH + 16, w: w * 0.9, h: 16,
            text: AD_LED_TEXTS[(i + 5) % AD_LED_TEXTS.length],
            bg: AD_LED_COLORS[(i + 3) % AD_LED_COLORS.length],
            side: 'near', index: i, glowColor: AD_LED_COLORS[(i + 3) % AD_LED_COLORS.length]
        });
    }
    // 左侧
    const leftCount = 8;
    for (let i = 0; i < leftCount; i++) {
        const hh = FH / leftCount;
        adData.push({
            x: -24, y: i * hh + hh / 2, w: 16, h: hh * 0.85,
            text: AD_LED_TEXTS[(i + 8) % AD_LED_TEXTS.length],
            bg: AD_LED_COLORS[(i + 6) % AD_LED_COLORS.length],
            side: 'left', index: i, glowColor: AD_LED_COLORS[(i + 6) % AD_LED_COLORS.length]
        });
    }
    // 右侧
    for (let i = 0; i < leftCount; i++) {
        const hh = FH / leftCount;
        adData.push({
            x: FW + 24, y: i * hh + hh / 2, w: 16, h: hh * 0.85,
            text: AD_LED_TEXTS[(i + 12) % AD_LED_TEXTS.length],
            bg: AD_LED_COLORS[(i + 1) % AD_LED_COLORS.length],
            side: 'right', index: i, glowColor: AD_LED_COLORS[(i + 1) % AD_LED_COLORS.length]
        });
    }
}

// ==============================================================
// 主渲染函数
// ==============================================================

function drawStadium() {
    if (!stadiumCrowd) initStadiumCrowd();
    if (!adData) initAds();
    const t = performance.now() / 1000;

    // == 第一阶段：看台建筑结构 ==

    // 远端三层
    const farBaseY = -16;
    const farTierDepth = [7 * 14, 7 * 14 + 8 * 12, 7 * 14 + 8 * 12 + 9 * 11];
    for (let tier = TIER_COUNT - 1; tier >= 0; tier--) {
        const rows = TIER_CONFIG.far.rows[tier];
        const yStart = farBaseY - (tier === 0 ? 0 : farTierDepth[tier - 1]);
        const stepH = [14, 12, 11][tier];
        for (let r = rows - 1; r >= 0; r--) {
            const y0 = yStart + r * stepH * (-1), y1 = yStart + (r + 1) * stepH * (-1);
            const shade = 14 + tier * 8 + r * 3;
            fillTrap(project(-60, y1), project(FW + 60, y1), project(FW + 60, y0), project(-60, y0), `rgb(${shade},${shade + 3},${shade + 14})`);
        }
        const rY = yStart + rows * stepH * (-1);
        fillTrap(project(-55, rY), project(FW + 55, rY), project(FW + 55, rY - 5), project(-55, rY - 5), '#4a4a5a');
    }

    // 近端三层
    const nearBaseY = FH + 12;
    const nearTierDepth = [5 * 14, 5 * 14 + 6 * 13, 5 * 14 + 6 * 13 + 7 * 12];
    for (let tier = TIER_COUNT - 1; tier >= 0; tier--) {
        const rows = TIER_CONFIG.near.rows[tier];
        const yStart = nearBaseY + (tier === 0 ? 0 : nearTierDepth[tier - 1]);
        const stepH = [14, 13, 12][tier];
        for (let r = rows - 1; r >= 0; r--) {
            const y0 = yStart + r * stepH, y1 = yStart + (r + 1) * stepH;
            const shade = 12 + tier * 7 + r * 4;
            fillTrap(project(-60, y0), project(FW + 60, y0), project(FW + 60, y1), project(-60, y1), `rgb(${shade},${shade + 2},${shade + 10})`);
        }
        const rY = yStart + rows * stepH;
        fillTrap(project(-55, rY), project(FW + 55, rY), project(FW + 55, rY + 3), project(-55, rY + 3), '#4a4a5a');
    }

    // 左侧多层
    const leftTierDepth = [11 * 10, 11 * 10 + 9 * 9, 11 * 10 + 9 * 9 + 7 * 8];
    for (let tier = TIER_COUNT - 1; tier >= 0; tier--) {
        const xStart = -22 - (tier === 0 ? 0 : leftTierDepth[tier - 1]);
        const rows = [11, 9, 7][tier], stepW = [10, 9, 8][tier];
        for (let r = rows - 1; r >= 0; r--) {
            const x0 = xStart + r * stepW * (-1), x1 = xStart + (r + 1) * stepW * (-1);
            const shade = 10 + tier * 6 + r * 2;
            fillTrap(project(x1, -60), project(x0, -60), project(x0, FH + 60), project(x1, FH + 60), `rgb(${shade},${shade + 3},${shade + 12})`);
        }
        const rx = xStart + rows * stepW * (-1);
        fillTrap(project(rx, -55), project(rx + 4, -55), project(rx + 4, FH + 55), project(rx, FH + 55), '#4a4a5a');
    }

    // 右侧多层
    for (let tier = TIER_COUNT - 1; tier >= 0; tier--) {
        const xStart = FW + 22 + (tier === 0 ? 0 : leftTierDepth[tier - 1]);
        const rows = [11, 9, 7][tier], stepW = [10, 9, 8][tier];
        for (let r = rows - 1; r >= 0; r--) {
            const x0 = xStart + r * stepW, x1 = xStart + (r + 1) * stepW;
            const shade = 10 + tier * 6 + r * 2;
            fillTrap(project(x0, -60), project(x1, -60), project(x1, FH + 60), project(x0, FH + 60), `rgb(${shade},${shade + 3},${shade + 12})`);
        }
        const rx = xStart + rows * stepW;
        fillTrap(project(rx - 4, -55), project(rx, -55), project(rx, FH + 55), project(rx - 4, FH + 55), '#4a4a5a');
    }

    // 四角
    [[-60, -60, 20, 20], [FW + 40, -60, 20, 20], [-60, FH + 40, 20, 20], [FW + 40, FH + 40, 20, 20]].forEach(c => {
        fillTrap(project(c[0], c[1]), project(c[0] + c[2], c[1]), project(c[0] + c[2], c[1] + c[3]), project(c[0], c[1] + c[3]), '#1a1a28');
    });

    // == 第二阶段：LED 电子广告牌 ==
    const ledGlow = 0.6 + Math.sin(t * 2.5) * 0.3;
    adData.forEach(ad => {
        const isH = ad.side === 'far' || ad.side === 'near';
        let tl, tr, bl, br;
        if (isH) {
            tl = project(ad.x - ad.w / 2, ad.y - ad.h, 6); tr = project(ad.x + ad.w / 2, ad.y - ad.h, 6);
            bl = project(ad.x - ad.w / 2, ad.y, 0);      br = project(ad.x + ad.w / 2, ad.y, 0);
        } else {
            tl = project(ad.x - ad.w, ad.y - ad.h / 2, 6); tr = project(ad.x, ad.y - ad.h / 2, 6);
            bl = project(ad.x - ad.w, ad.y + ad.h / 2, 0); br = project(ad.x, ad.y + ad.h / 2, 0);
        }
        const mid = isH ? project(ad.x, ad.y - ad.h * 0.5, 4) : project(ad.x - ad.w * 0.5, ad.y, 4);
        const midDS = mid.dscale || 0.85;
        fillTrap(tl, tr, br, bl, ad.bg);
        ctx.strokeStyle = ad.glowColor; ctx.lineWidth = 2 * midDS;
        ctx.save();
        try { ctx.shadowColor = ad.glowColor; ctx.shadowBlur = 8 * ledGlow * midDS; } catch (e) { /* ignore */ }
        ctx.beginPath(); ctx.moveTo(tl.sx, tl.sy); ctx.lineTo(tr.sx, tr.sy);
        ctx.lineTo(br.sx, br.sy); ctx.lineTo(bl.sx, bl.sy);
        ctx.closePath(); ctx.stroke(); ctx.restore();
        ctx.fillStyle = '#fff';
        const fs = Math.max(5, (isH ? 11 : 8) * midDS);
        ctx.font = `bold ${fs}px "Courier New", monospace`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.save();
        try { ctx.shadowColor = 'rgba(255,255,255,.9)'; ctx.shadowBlur = 4 * ledGlow * midDS; } catch (e) { /* ignore */ }
        ctx.fillText(ad.text, mid.sx, mid.sy); ctx.restore();
        // LED 小灯珠
        const dotCount = isH ? 6 : 4;
        for (let d = 0; d < dotCount; d++) {
            const frac = (d + 0.5) / dotCount;
            const dx = isH ? tl.sx + (tr.sx - tl.sx) * frac : tl.sx + (tr.sx - tl.sx) * 0.5;
            const dy = isH ? bl.sy + (br.sy - bl.sy) * 0.85 : tl.sy + (bl.sy - tl.sy) * frac;
            ctx.fillStyle = Math.sin(t * 8 + d * 1.7) > 0 ? ad.glowColor : '#333';
            ctx.beginPath(); ctx.arc(dx, dy, 2 * midDS, 0, Math.PI * 2); ctx.fill();
        }
    });

    // == 第三阶段：观众 ==
    const sorted = [...stadiumCrowd].sort((a, b) => a.y - b.y);
    sorted.forEach(c => {
        const pos = project(c.x, c.y), ds = pos.dscale;
        if (ds < 0.10) return;
        const t2 = performance.now() / 1000;
        const bob = Math.sin(t2 * 2.1 + c.jitter) * 0.35;
        const w = c.w * ds, h = c.h * ds;
        const px = pos.sx, py = pos.sy + bob;
        const headR = w * 0.28, headCY = py - h * 0.92, neckY = py - h * 0.68;
        const shL = px - w * 0.32, shR = px + w * 0.32, shY = py - h * 0.70;
        const waL = px - w * 0.18, waR = px + w * 0.18, waY = py - h * 0.15;
        const hipL = px - w * 0.16, hipR = px + w * 0.16, hipY = py - h * 0.08;
        const kneeY = py + h * 0.12, footY = py + h * 0.28;

        if (ds < 0.22) {
            // 远景简化人形
            ctx.globalAlpha = 0.4 + ds * 0.7;
            ctx.fillStyle = c.shirt;
            ctx.beginPath(); ctx.moveTo(shL, shY); ctx.lineTo(shR, shY); ctx.lineTo(waR, waY); ctx.lineTo(waL, waY);
            ctx.closePath(); ctx.fill();
            ctx.fillStyle = c.skin;
            ctx.beginPath(); ctx.arc(px, headCY, headR, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = '#1a1a2e'; ctx.lineWidth = w * 0.08; ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(hipL, hipY); ctx.lineTo(px - w * 0.12, kneeY); ctx.lineTo(px - w * 0.1, footY);
            ctx.moveTo(hipR, hipY); ctx.lineTo(px + w * 0.12, kneeY); ctx.lineTo(px + w * 0.1, footY);
            ctx.stroke();
            ctx.strokeStyle = c.skin; ctx.lineWidth = w * 0.07;
            ctx.beginPath();
            ctx.moveTo(shL + w * 0.04, shY + 2); ctx.lineTo(px - w * 0.22, py - h * 0.2);
            ctx.moveTo(shR - w * 0.04, shY + 2); ctx.lineTo(px + w * 0.22, py - h * 0.2);
            ctx.stroke();
        } else if (ds < 0.45) {
            // 中景
            ctx.globalAlpha = 0.55 + ds * 0.45;
            ctx.strokeStyle = '#1a1a2e'; ctx.lineWidth = w * 0.12; ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(hipL, hipY); ctx.lineTo(px - w * 0.14, kneeY); ctx.lineTo(px - w * 0.12, footY);
            ctx.moveTo(hipR, hipY); ctx.lineTo(px + w * 0.14, kneeY); ctx.lineTo(px + w * 0.12, footY);
            ctx.stroke();
            ctx.strokeStyle = c.skin; ctx.lineWidth = w * 0.1; ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(shL + w * 0.05, shY + 2); ctx.lineTo(px - w * 0.24, py - h * 0.22);
            ctx.moveTo(shR - w * 0.05, shY + 2); ctx.lineTo(px + w * 0.24, py - h * 0.22);
            ctx.stroke();
            ctx.fillStyle = c.shirt;
            ctx.beginPath(); ctx.moveTo(shL, shY); ctx.lineTo(shR, shY); ctx.lineTo(waR, waY); ctx.lineTo(waL, waY);
            ctx.closePath(); ctx.fill();
            ctx.fillStyle = c.skin;
            ctx.beginPath(); ctx.arc(px, headCY, headR, 0, Math.PI * 2); ctx.fill();
        } else {
            // 近景完整人形 + 动画
            ctx.globalAlpha = 0.68 + ds * 0.32;
            ctx.strokeStyle = '#1a1a2e'; ctx.lineWidth = w * 0.15; ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(hipL, hipY); ctx.lineTo(px - w * 0.14, kneeY); ctx.lineTo(px - w * 0.12, footY);
            ctx.moveTo(hipR, hipY); ctx.lineTo(px + w * 0.14, kneeY); ctx.lineTo(px + w * 0.12, footY);
            ctx.stroke();
            ctx.fillStyle = c.shirt;
            ctx.beginPath(); ctx.moveTo(shL, shY); ctx.lineTo(shR, shY); ctx.lineTo(waR, waY); ctx.lineTo(waL, waY);
            ctx.closePath(); ctx.fill();
            ctx.fillStyle = c.skin;
            ctx.beginPath(); ctx.arc(px, headCY, headR, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = c.skin; ctx.lineWidth = w * 0.12; ctx.lineCap = 'round';
            if (c.wave) {
                const waveAng = Math.sin(t2 * 3.5 + c.jitter) * 0.55 + 1.2;
                ctx.beginPath();
                ctx.moveTo(shL + w * 0.06, shY + 2); ctx.lineTo(px - w * 0.22, py - h * 0.2);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(shR - w * 0.06, shY + 2);
                ctx.lineTo(shR + Math.cos(waveAng) * w * 0.65, shY - Math.sin(waveAng) * w * 0.65);
                ctx.stroke();
            } else if (c.clap) {
                const clapIn = Math.abs(Math.sin(t2 * 4.5 + c.jitter)) * 0.25;
                ctx.beginPath();
                ctx.moveTo(shL + w * 0.06, shY + 2); ctx.lineTo(px - w * 0.08 - clapIn * w * 0.35, py - h * 0.35);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(shR - w * 0.06, shY + 2); ctx.lineTo(px + w * 0.08 + clapIn * w * 0.35, py - h * 0.35);
                ctx.stroke();
            } else {
                ctx.beginPath();
                ctx.moveTo(shL + w * 0.06, shY + 2); ctx.lineTo(px - w * 0.22, py - h * 0.2);
                ctx.moveTo(shR - w * 0.06, shY + 2); ctx.lineTo(px + w * 0.22, py - h * 0.2);
                ctx.stroke();
            }
            if (c.hasScarf) {
                ctx.fillStyle = '#ffd60a';
                ctx.beginPath(); ctx.ellipse(px, neckY + w * 0.04, w * 0.28, w * 0.1, -0.15, 0, Math.PI * 2); ctx.fill();
            }
        }
    });

    // 灯光暗角
    ctx.globalAlpha = 0.15;
    const farGrad = ctx.createLinearGradient(0, project(0, -16).sy, 0, project(0, -216).sy);
    farGrad.addColorStop(0, 'rgba(0,0,0,0)'); farGrad.addColorStop(0.3, 'rgba(0,0,0,.65)'); farGrad.addColorStop(1, 'rgba(0,0,0,.88)');
    ctx.fillStyle = farGrad; ctx.fillRect(0, 0, cv.width, project(0, -216).sy);
    const nearGrad = ctx.createLinearGradient(0, project(0, FH + 200).sy, 0, project(0, FH + 12).sy);
    nearGrad.addColorStop(0, 'rgba(0,0,0,.82)'); nearGrad.addColorStop(0.5, 'rgba(0,0,0,.18)'); nearGrad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = nearGrad; ctx.fillRect(0, project(0, FH + 12).sy, cv.width, project(0, FH + 200).sy - project(0, FH + 12).sy);
    ctx.globalAlpha = 1;

    // == 第四阶段：场边细节 ==
    // 摄像机
    [FW * 0.2, FW * 0.4, FW * 0.6, FW * 0.8].forEach(cx => drawCamera(cx, -18));
    [FW * 0.3, FW * 0.7].forEach(cx => drawCamera(cx, FH + 14));
    // 替补席
    drawBench(-18, FH / 2 - 70, true);
    drawBench(FW + 18, FH / 2 - 70, false);
    // 角旗
    [[WALL, WALL], [FW - WALL, WALL], [WALL, FH - WALL], [FW - WALL, FH - WALL]].forEach(([cx, cy]) => {
        const cp = project(cx, cy);
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5 * cp.dscale;
        ctx.beginPath(); ctx.moveTo(cp.sx, cp.sy); ctx.lineTo(cp.sx, cp.sy - 12 * cp.dscale); ctx.stroke();
        ctx.fillStyle = '#ffd60a';
        ctx.beginPath(); ctx.arc(cp.sx, cp.sy - 13 * cp.dscale, 3 * cp.dscale, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#e63946';
        ctx.beginPath();
        ctx.moveTo(cp.sx, cp.sy - 13 * cp.dscale);
        ctx.lineTo(cp.sx + 7 * cp.dscale, cp.sy - 17 * cp.dscale);
        ctx.lineTo(cp.sx, cp.sy - 20 * cp.dscale);
        ctx.closePath(); ctx.fill();
    });
}

// 场边摄像机
function drawCamera(cx, cy) {
    const pos = project(cx, cy), ds = pos.dscale, sz = 7 * ds;
    const sx = pos.sx, sy = pos.sy;
    ctx.strokeStyle = '#222'; ctx.lineWidth = 1.5 * ds; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(sx, sy); ctx.lineTo(sx - sz * 0.8, sy + sz * 1.5);
    ctx.moveTo(sx, sy); ctx.lineTo(sx + sz * 0.8, sy + sz * 1.5);
    ctx.moveTo(sx, sy); ctx.lineTo(sx, sy + sz * 1.5);
    ctx.stroke();
    ctx.fillStyle = '#1a1a1a';
    ctx.beginPath(); ctx.ellipse(sx, sy - sz * 0.3, sz * 0.7, sz * 0.5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#0a0a0a';
    ctx.beginPath(); ctx.ellipse(sx, sy - sz * 0.3, sz * 0.3, sz * 0.22, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(100,180,255,.4)';
    ctx.beginPath(); ctx.arc(sx - sz * 0.1, sy - sz * 0.4, sz * 0.12, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ff3333';
    ctx.beginPath(); ctx.arc(sx + sz * 0.35, sy - sz * 0.4, sz * 0.1, 0, Math.PI * 2); ctx.fill();
}

// 替补席
function drawBench(bx, by, isLeft) {
    const len = 120, bw = 14;
    const tl = project(bx, by, 22), tr = project(bx + len, by, 22);
    const bl = project(bx, by + bw, 0), br = project(bx + len, by + bw, 0);
    fillTrap(tl, tr, br, bl, isLeft ? 'rgba(60,70,90,.9)' : 'rgba(90,70,60,.9)');
    const sl = project(bx, by + bw, 0), sr = project(bx + len, by + bw, 0);
    const sbl = project(bx, by + bw + 8, 0), sbr = project(bx + len, by + bw + 8, 0);
    fillTrap(sl, sr, sbr, sbl, 'rgba(40,45,55,.95)');
    for (let i = 0; i < 4; i++) {
        const px = bx + 18 + i * 28, py = by + bw + 4;
        const pos = project(px, py), dr = 6 * pos.dscale;
        const teamColor = isLeft ? '#3a86ff' : '#e63946';
        ctx.fillStyle = teamColor;
        ctx.beginPath(); ctx.ellipse(pos.sx, pos.sy - dr * 0.5, dr * 0.8, dr * 0.6, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#f0c0a0';
        ctx.beginPath(); ctx.arc(pos.sx, pos.sy - dr * 1.1, dr * 0.4, 0, Math.PI * 2); ctx.fill();
    }
    // 教练
    const cox = isLeft ? bx + len - 8 : bx + 8, cpos = project(cox, by + bw + 4);
    const cdr = 7 * cpos.dscale;
    ctx.fillStyle = isLeft ? '#1a4a99' : '#a01818';
    ctx.beginPath(); ctx.ellipse(cpos.sx, cpos.sy - cdr * 0.6, cdr * 0.7, cdr * 0.9, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#f0c0a0';
    ctx.beginPath(); ctx.arc(cpos.sx, cpos.sy - cdr * 1.4, cdr * 0.42, 0, Math.PI * 2); ctx.fill();
}

// =================================================================
// renderer/field.js — 球场绘制：草地、割草条纹、边线、禁区、中圈、球门、越位线
// 绿茵对决 · 足球游戏
// =================================================================

function drawField() {
    // 草地基础色
    const ftl = project(0, 0), ftr = project(FW, 0), fbl = project(0, FH), fbr = project(FW, FH);
    fillTrap(ftl, ftr, fbr, fbl, '#2f8a2f');

    // 竖向割草条纹
    const stripes = 14;
    for (let i = 0; i < stripes; i++) {
        const x0 = i * FW / stripes, x1 = (i + 1) * FW / stripes;
        fillTrap(project(x0, 0), project(x1, 0), project(x1, FH), project(x0, FH),
            i % 2 ? 'rgba(255,255,255,.04)' : 'rgba(0,0,0,.06)');
    }

    // 深度渐变（远端暗 → 近端亮）
    const grad = ctx.createLinearGradient(0, ftl.sy, 0, fbl.sy);
    grad.addColorStop(0, 'rgba(0,0,0,.32)');
    grad.addColorStop(0.5, 'rgba(0,0,0,0)');
    grad.addColorStop(1, 'rgba(255,255,255,.06)');
    fillTrap(ftl, ftr, fbr, fbl, grad);

    // 边角虚化
    const vg = ctx.createRadialGradient(FW / 2, (ftl.sy + fbl.sy) / 2, FW * 0.3, FW / 2, (ftl.sy + fbl.sy) / 2, FW * 0.7);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(0,0,0,.25)');
    fillTrap(ftl, ftr, fbr, fbl, vg);

    // 边线
    ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = WALL;
    const tl = project(WALL / 2, WALL / 2), tr = project(FW - WALL / 2, WALL / 2);
    const bl_ = project(WALL / 2, FH - WALL / 2), br_ = project(FW - WALL / 2, FH - WALL / 2);
    ctx.beginPath();
    ctx.moveTo(tl.sx, tl.sy); ctx.lineTo(tr.sx, tr.sy);
    ctx.lineTo(br_.sx, br_.sy); ctx.lineTo(bl_.sx, bl_.sy);
    ctx.closePath(); ctx.stroke();

    // 中线 + 中圈
    ctx.lineWidth = 3;
    if (mode === 'match') {
        const mt = project(FW / 2, WALL), mb = project(FW / 2, FH - WALL);
        ctx.beginPath(); ctx.moveTo(mt.sx, mt.sy); ctx.lineTo(mb.sx, mb.sy); ctx.stroke();
        const mc = project(FW / 2, FH / 2);
        ctx.beginPath(); ctx.ellipse(mc.sx, mc.sy, 125 * mc.dscale, 125 * CAM_TILT, 0, 0, Math.PI * 2); ctx.stroke();
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(mc.sx, mc.sy, 4, 0, Math.PI * 2); ctx.fill();
    }

    // 大禁区（左右）
    const bw = 225, bh = 550;
    drawRect(WALL, FH / 2 - bh / 2, WALL + bw, FH / 2 + bh / 2);
    drawRect(FW - WALL - bw, FH / 2 - bh / 2, FW - WALL, FH / 2 + bh / 2);

    // 小禁区
    const sw = 75, sh = 250;
    drawRect(WALL, FH / 2 - sh / 2, WALL + sw, FH / 2 + sh / 2);
    drawRect(FW - WALL - sw, FH / 2 - sh / 2, FW - WALL, FH / 2 + sh / 2);

    // 点球点 + 罚球弧
    if (mode === 'match') {
        const penDist = 150, arcR = 125;
        const a1 = Math.acos((bw - penDist) / arcR);
        const pl = project(WALL + penDist, FH / 2);
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(pl.sx, pl.sy, 4 * pl.dscale, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(pl.sx, pl.sy, arcR * pl.dscale, arcR * CAM_TILT, 0, -a1, a1); ctx.stroke();
        const pr = project(FW - WALL - penDist, FH / 2);
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(pr.sx, pr.sy, 4 * pr.dscale, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(pr.sx, pr.sy, arcR * pr.dscale, arcR * CAM_TILT, 0, Math.PI - a1, Math.PI + a1); ctx.stroke();
    }

    // 越位线（虚线）
    if (mode === 'match' && state === 'playing' && ball.lastTeam >= 0 && ball.lastTeam <= 1) {
        const attTeam = ball.lastTeam, lineX = getOffsideLine(attTeam);
        const lt = project(lineX, 0), lb = project(lineX, FH);
        ctx.save();
        ctx.strokeStyle = 'rgba(255,214,10,.35)'; ctx.lineWidth = 2;
        ctx.setLineDash([8, 6]);
        ctx.beginPath(); ctx.moveTo(lt.sx, lt.sy); ctx.lineTo(lb.sx, lb.sy); ctx.stroke();
        ctx.restore();
    }

    // 3D 球门
    drawGoal3D(0, FH / 2, true);
    drawGoal3D(FW, FH / 2, false);

    // 点球点（penalty 模式）
    if (mode === 'penalty') {
        ctx.fillStyle = '#fff';
        const pl = project(PEN_SPOT_L.x, PEN_SPOT_L.y), pr = project(PEN_SPOT_R.x, PEN_SPOT_R.y);
        ctx.beginPath(); ctx.arc(pl.sx, pl.sy, 3, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(pr.sx, pr.sy, 3, 0, Math.PI * 2); ctx.fill();
    }
}

// 矩形（透视后 → 梯形）
function drawRect(x1, y1, x2, y2) {
    const a = project(x1, y1), b = project(x2, y1), c = project(x2, y2), d = project(x1, y2);
    ctx.beginPath();
    ctx.moveTo(a.sx, a.sy); ctx.lineTo(b.sx, b.sy);
    ctx.lineTo(c.sx, c.sy); ctx.lineTo(d.sx, d.sy);
    ctx.closePath(); ctx.stroke();
}

// 3D 球门（带网）
function drawGoal3D(gx, gy, isLeft) {
    const postH = 34;
    const depth = isLeft ? -20 : 20;
    const ftl = project(gx, gy - GOAL_H / 2), fbl = project(gx, gy + GOAL_H / 2);
    const btl = project(gx + depth, gy - GOAL_H / 2), bbl = project(gx + depth, gy + GOAL_H / 2);
    const fTopL = ftl.sy - postH, fTopR = fbl.sy - postH;
    const bTopL = btl.sy - postH * 0.72, bTopR = bbl.sy - postH * 0.72;

    // 网格四边形
    function netQuad(x1, y1, x2, y2, x3, y3, x4, y4, cols, rows) {
        ctx.fillStyle = 'rgba(255,255,255,.07)';
        ctx.beginPath();
        ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.lineTo(x3, y3); ctx.lineTo(x4, y4);
        ctx.closePath(); ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,.28)'; ctx.lineWidth = 1;
        for (let i = 1; i < cols; i++) {
            const t = i / cols;
            ctx.beginPath();
            ctx.moveTo(x1 + (x2 - x1) * t, y1 + (y2 - y1) * t);
            ctx.lineTo(x4 + (x3 - x4) * t, y4 + (y3 - y4) * t);
            ctx.stroke();
        }
        for (let j = 1; j < rows; j++) {
            const t = j / rows;
            ctx.beginPath();
            ctx.moveTo(x1 + (x4 - x1) * t, y1 + (y4 - y1) * t);
            ctx.lineTo(x2 + (x3 - x2) * t, y2 + (y3 - y2) * t);
            ctx.stroke();
        }
    }

    netQuad(btl.sx, bTopL, bbl.sx, bTopR, bbl.sx, bbl.sy, btl.sx, btl.sy, 6, 5);
    netQuad(ftl.sx, fTopL, fbl.sx, fTopR, bbl.sx, bTopR, btl.sx, bTopL, 6, 3);
    netQuad(ftl.sx, ftl.sy, ftl.sx, fTopL, btl.sx, bTopL, btl.sx, btl.sy, 3, 5);
    netQuad(fbl.sx, fTopR, fbl.sx, fbl.sy, bbl.sx, bbl.sy, bbl.sx, bTopR, 3, 5);

    // 门柱 + 横梁
    ctx.strokeStyle = '#f5f5f5'; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(ftl.sx, ftl.sy); ctx.lineTo(ftl.sx, fTopL); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(fbl.sx, fbl.sy); ctx.lineTo(fbl.sx, fTopR); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(ftl.sx, fTopL); ctx.lineTo(fbl.sx, fTopR); ctx.stroke();
}

// =================================================================
// renderer/player.js — 球员渲染：站姿、铲球、扑救、球衣号码、姓名、体力条
// 绿茵对决 · 足球游戏
//
// 球员按 y 深度排序绘制（远处先画）。
// 铲球时显示低姿态滑铲 + 扬尘效果。
// 门将扑救时显示侧倒 + 伸展手臂。
// =================================================================

const roleColor = { GK: null, DEF: '#7CFC00', MID: '#ffd60a', FWD: '#ffffff' };

function drawPlayers() {
    // 按深度排序（远→近）
    const sorted = players.map((p, i) => ({ p, i, depth: p.y })).sort((a, b) => a.depth - b.depth);
    sorted.forEach(({ p, i }) => {
        if (p.sentOff) return;
        const isRed = p.team === TEAM_RED;
        const pos = project(p.x, p.y);
        const sx = pos.sx, feetY = pos.sy;
        const dr = p.r * pos.dscale;
        const fl = Math.hypot(p.face.x, p.face.y) || 1;
        const dx = p.face.x / fl, dy = p.face.y / fl;
        const sliding = p.slide > 0;

        // 阴影
        ctx.fillStyle = 'rgba(0,0,0,.35)';
        ctx.beginPath(); ctx.ellipse(sx + 2, feetY + 3, dr * 0.85, dr * 0.85 * CAM_TILT * 0.6, 0, 0, Math.PI * 2); ctx.fill();

        // 活跃球员高亮
        if (i === activeIdx && state !== 'over') {
            ctx.strokeStyle = '#ffd60a'; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.ellipse(sx, feetY, dr + 4, (dr + 4) * CAM_TILT * 0.6, 0, 0, Math.PI * 2); ctx.stroke();
        }

        // 持球指示
        if (ball.owner === p) {
            ctx.strokeStyle = 'rgba(255,214,10,.7)'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.ellipse(sx, feetY, dr + 7, (dr + 7) * CAM_TILT * 0.6, 0, 0, Math.PI * 2); ctx.stroke();
        }

        // 黄/红牌标记
        if (p.cards > 0) {
            const cardX = sx + dr + 5, cardY = feetY - 32;
            ctx.fillStyle = p.cards >= 2 ? '#e63946' : '#ffd60a';
            ctx.fillRect(cardX, cardY, 7, 10);
            ctx.strokeStyle = '#000'; ctx.lineWidth = 0.8;
            ctx.strokeRect(cardX, cardY, 7, 10);
        }

        if (sliding) {
            drawSlidingPlayer(p, sx, feetY, dr, isRed);
        } else if (p.gk && p.diveTimer && p.diveTimer > 0) {
            drawDivingGK(p, sx, feetY, dr, isRed);
        } else {
            drawStandingPlayer(p, i, sx, feetY, dr, dx, dy, isRed);
        }
    });
}

// 站姿球员
function drawStandingPlayer(p, i, sx, feetY, dr, dx, dy, isRed) {
    const fh = 30;
    const hipY = feetY - fh * 0.38;
    const shY  = feetY - fh * 0.70;
    const hdY  = feetY - fh * 0.88;
    const bw2 = dr * 1.25, bw1 = dr * 0.85;

    // 腿
    ctx.strokeStyle = isRed ? '#7a1a1a' : '#143060';
    ctx.lineWidth = 3.5; ctx.lineCap = 'round';
    const legS = 3.5;
    ctx.beginPath();
    ctx.moveTo(sx - legS + dx * 1.5, hipY); ctx.lineTo(sx - legS, feetY);
    ctx.moveTo(sx + legS + dx * 1.5, hipY); ctx.lineTo(sx + legS, feetY);
    ctx.stroke();

    // 球衣（梯形）
    const jCol = p.gk ? (isRed ? '#ffb703' : '#fb8500') : (isRed ? '#e63946' : '#3a86ff');
    const jDark = p.gk ? (isRed ? '#cc8800' : '#cc5500') : (isRed ? '#a01818' : '#1a4a99');
    const grad = ctx.createLinearGradient(sx, shY, sx, hipY);
    grad.addColorStop(0, jCol); grad.addColorStop(1, jDark);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(sx - bw1, shY); ctx.lineTo(sx + bw1, shY);
    ctx.lineTo(sx + bw2, hipY); ctx.lineTo(sx - bw2, hipY);
    ctx.closePath(); ctx.fill();

    // 角色色条
    if (!p.gk && roleColor[p.role]) {
        ctx.strokeStyle = roleColor[p.role]; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(sx - bw1 + 1, shY + 1.5); ctx.lineTo(sx + bw1 - 1, shY + 1.5); ctx.stroke();
    }

    // 手臂
    ctx.strokeStyle = isRed ? '#e63946' : '#3a86ff';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(sx - bw1, shY + 2); ctx.lineTo(sx - bw1 - 4, hipY - 1);
    ctx.moveTo(sx + bw1, shY + 2); ctx.lineTo(sx + bw1 + 4, hipY - 1);
    ctx.stroke();

    // 头
    const hdR = dr * 0.42;
    ctx.fillStyle = '#f0c0a0';
    ctx.beginPath(); ctx.arc(sx + dx * 2.5, hdY, hdR, 0, Math.PI * 2); ctx.fill();
    // 头发
    ctx.fillStyle = isRed ? '#5a3010' : '#2a1a05';
    ctx.beginPath(); ctx.arc(sx + dx * 2.5, hdY - hdR * 0.3, hdR * 0.85, Math.PI, 0); ctx.fill();

    // 号码
    ctx.fillStyle = '#fff'; ctx.font = 'bold 9px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(String((i % 11) + 1), sx, (shY + hipY) / 2);

    // 姓名
    ctx.fillStyle = i === activeIdx ? '#ffd60a' : 'rgba(255,255,255,.85)';
    ctx.font = (i === activeIdx ? 'bold ' : '') + '9px sans-serif'; ctx.textBaseline = 'bottom';
    ctx.fillText(p.name || '', sx, hdY - hdR - 2);

    // 体力条（仅活跃球员）
    if (i === activeIdx) {
        const bw = 28, bh = 4, bx = sx - bw / 2, by = hdY - hdR - 11;
        ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(bx - 1, by - 1, bw + 2, bh + 2);
        const sr = (p.stamina ?? 100) / 100;
        ctx.fillStyle = sr > 0.5 ? '#7CFC00' : sr > 0.2 ? '#ffd60a' : '#e63946';
        ctx.fillRect(bx, by, bw * sr, bh);
    }
}

// 铲球姿态
function drawSlidingPlayer(p, sx, feetY, dr, isRed) {
    const sdx = p.slideDir.x, sdy = p.slideDir.y;
    const slideAng = Math.atan2(sdy, sdx);
    const slideProgress = p.slide / 0.5;
    const tPower = p.slidePower || 0.5;
    const slideLen = dr * (1.2 + slideProgress * 1.0 + tPower * 1.5);

    // 扬尘
    const dustCount = Math.floor(2 + tPower * 4);
    ctx.fillStyle = `rgba(180,160,120,${0.3 + tPower * 0.2})`;
    for (let d = 0; d < dustCount; d++) {
        const dustX = sx - sdx * (slideLen + d * 7) + (Math.random() - 0.5) * 5;
        const dustY = feetY - sdy * (slideLen + d * 7) * 0.3 + (Math.random() - 0.5) * 4;
        ctx.beginPath(); ctx.arc(dustX, dustY, 3 - d * 0.4, 0, Math.PI * 2); ctx.fill();
    }

    // 滑行残影
    ctx.strokeStyle = `rgba(255,255,255,${0.15 + slideProgress * 0.25})`; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(sx - sdx * slideLen, feetY - sdy * slideLen * 0.3); ctx.lineTo(sx, feetY); ctx.stroke();

    const jCol = p.gk ? (isRed ? '#ffb703' : '#fb8500') : (isRed ? '#e63946' : '#3a86ff');
    const jDark = p.gk ? (isRed ? '#cc8800' : '#cc5500') : (isRed ? '#a01818' : '#1a4a99');

    ctx.save();
    ctx.translate(sx, feetY - 4);
    ctx.rotate(slideAng);
    // 后腿
    ctx.strokeStyle = isRed ? '#7a1a1a' : '#143060'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-dr * 0.5, 0); ctx.lineTo(-dr * 0.8, -dr * 0.5);
    ctx.stroke();
    // 躯干
    const grad = ctx.createLinearGradient(0, -dr * 0.5, 0, dr * 0.3);
    grad.addColorStop(0, jCol); grad.addColorStop(1, jDark);
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.ellipse(0, -2, dr * 1.1, dr * 0.55, 0, 0, Math.PI * 2); ctx.fill();
    // 铲球腿
    ctx.strokeStyle = isRed ? '#7a1a1a' : '#143060'; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(dr * 0.6, -2); ctx.lineTo(dr * 2.0, 2);
    ctx.stroke();
    // 鞋
    ctx.fillStyle = isRed ? '#e63946' : '#3a86ff';
    ctx.beginPath(); ctx.ellipse(dr * 2.0, 2, 5, 3.5, 0, 0, Math.PI * 2); ctx.fill();
    // 手臂
    ctx.strokeStyle = jCol; ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(-dr * 0.3, -4); ctx.lineTo(-dr * 1.0, -dr * 0.6);
    ctx.stroke();
    ctx.restore();

    // 头
    ctx.fillStyle = '#f0c0a0';
    const headX = sx + sdx * dr * 1.2;
    const headY = feetY - 10 - Math.abs(sdy) * 5;
    ctx.beginPath(); ctx.arc(headX, headY, dr * 0.38, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = isRed ? '#5a3010' : '#2a1a05';
    ctx.beginPath(); ctx.arc(headX - sdx * 2, headY - 2, dr * 0.3, Math.PI * 0.3, Math.PI * 1.3); ctx.fill();
}

// 门将扑救
function drawDivingGK(p, sx, feetY, dr, isRed) {
    const diveDir = p.diveDir || 0;
    const jCol = isRed ? '#ffb703' : '#fb8500';
    const jDark = isRed ? '#cc8800' : '#cc5500';

    ctx.strokeStyle = 'rgba(255,180,0,.35)'; ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(sx, feetY - 14);
    ctx.lineTo(sx + diveDir * 20, feetY - 14 - Math.abs(diveDir) * 15);
    ctx.stroke();

    ctx.save();
    ctx.translate(sx, feetY - 14);
    const diveAng = diveDir * 0.7;
    ctx.rotate(diveAng);
    const grad = ctx.createLinearGradient(0, -dr * 0.6, 0, dr * 0.6);
    grad.addColorStop(0, jCol); grad.addColorStop(1, jDark);
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.ellipse(0, 0, dr * 1.4, dr * 0.65, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = jCol; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
    const armExt = dr * 1.6;
    ctx.beginPath();
    ctx.moveTo(dr * 0.8, -dr * 0.3); ctx.lineTo(armExt, -dr * 0.5);
    ctx.moveTo(dr * 0.8, dr * 0.3); ctx.lineTo(armExt * 0.9, dr * 0.4);
    ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(armExt, -dr * 0.5, 4, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(armExt * 0.9, dr * 0.4, 4, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    const headX = sx + diveDir * dr * 0.8;
    const headY = feetY - 14 - Math.abs(diveDir) * 8;
    ctx.fillStyle = '#f0c0a0';
    ctx.beginPath(); ctx.arc(headX, headY, dr * 0.42, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = isRed ? '#5a3010' : '#2a1a05';
    ctx.beginPath(); ctx.arc(headX, headY - dr * 0.15, dr * 0.35, Math.PI, 0); ctx.fill();
}

// 点球模式绘制
function drawPenalty() {
    const isPlayerTurn = penState === 'aim' || penState === 'shoot' || penState === 'result';
    const spot = isPlayerTurn ? PEN_SPOT_L : PEN_SPOT_R;
    const shooterColor = isPlayerTurn ? '#e63946' : '#3a86ff';
    const sp = project(spot.x, spot.y);
    const kp = project(keeperX, keeperDiveY);

    // 罚球者
    ctx.fillStyle = 'rgba(0,0,0,.35)';
    ctx.beginPath(); ctx.ellipse(sp.sx + 2, sp.sy + 3, 13, 9 * CAM_TILT, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = shooterColor;
    ctx.beginPath(); ctx.arc(sp.sx, sp.sy, 13, 0, Math.PI * 2); ctx.fill();

    // 门将
    ctx.fillStyle = isPlayerTurn ? '#3a86ff' : '#ffb703';
    ctx.beginPath(); ctx.arc(kp.sx, kp.sy, 14, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(kp.sx, kp.sy, 18, 18 * CAM_TILT, 0, 0, Math.PI * 2); ctx.stroke();

    // 瞄准光标（玩家的回合）
    if (penState === 'aim') {
        const gp = project(WALL + GOAL_D / 2, aimY);
        ctx.strokeStyle = '#ffd60a'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.ellipse(gp.sx, gp.sy, 12, 12 * CAM_TILT, 0, 0, Math.PI * 2); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(gp.sx - 18, gp.sy); ctx.lineTo(gp.sx + 18, gp.sy); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(gp.sx, gp.sy - 18); ctx.lineTo(gp.sx, gp.sy + 18); ctx.stroke();
        ctx.fillStyle = '#fff'; ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText('空格 / 射门键 锁定方向', FW / 2, project(0, FH - 40).sy);
    }
}

// =================================================================
// renderer/ball.js — 足球渲染、飞行轨迹虚线、长传弧线预览、高度指示条
// 绿茵对决 · 足球游戏
//
// drawBallObj(b): 绘制足球本体（白色带五边形花纹）及地面阴影。
//   b: {x, y, z, vx, vy, r} — 球对象或 penBall
// drawBallTrail(): 飞行轨迹虚线（z轴渐变着色）
// drawLobPassPreview(): 蓄力期间的弧线预览
// drawBallHeightBar(): 屏幕右侧球高度实时指示条
// =================================================================

function drawBallObj(b) {
    const pos = project(b.x, b.y);
    const zH = (b.z || 0);
    const top = project(b.x, b.y, zH);
    const ds = pos.dscale;

    // 地面阴影：越高越小越淡
    const shadowScale = Math.max(0.3, 1 - zH / 200) * ds;
    const shadowAlpha = Math.max(0.1, 0.4 - zH / 400);
    ctx.fillStyle = `rgba(0,0,0,${shadowAlpha})`;
    ctx.beginPath();
    ctx.ellipse(pos.sx + 1, pos.sy + 2, b.r * shadowScale, b.r * CAM_TILT * 0.7 * shadowScale, 0, 0, Math.PI * 2);
    ctx.fill();

    // 球本体
    const ballScale = (1 + zH / 600) * ds;
    const drawY = top.sy;
    const drawR = b.r * ballScale;
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(pos.sx, drawY, drawR, 0, Math.PI * 2); ctx.fill();

    // 五边形花纹
    ctx.fillStyle = '#222';
    const a = Math.atan2(b.vy, b.vx) + performance.now() / 300;
    for (let i = 0; i < 5; i++) {
        const ang = a + i * Math.PI * 2 / 5;
        ctx.beginPath();
        ctx.arc(pos.sx + Math.cos(ang) * drawR * 0.5, drawY + Math.sin(ang) * drawR * 0.5, drawR * 0.28, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.strokeStyle = '#999'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(pos.sx, drawY, drawR, 0, Math.PI * 2); ctx.stroke();
}

// 飞行轨迹虚线
function drawBallTrail() {
    if (ballTrail.length < 2) return;
    const maxH = 200;
    const n = ballTrail.length;
    for (let i = 0; i < n - 1; i++) {
        if (i % 2 !== 0) continue;   // 隔段画，形成虚线
        const p0 = ballTrail[i], p1 = ballTrail[i + 1];
        const pos0 = project(p0.x, p0.y, p0.z);
        const pos1 = project(p1.x, p1.y, p1.z);
        const age = 1 - (i + 1) / n;
        if (age < 0.08) continue;
        const alpha = 0.15 + age * 0.7;
        const zAvg = (p0.z + p1.z) / 2;
        const t = Math.min(1, zAvg / maxH);
        let r, g, b;
        if (t < 0.5) {
            const s = t * 2;
            r = Math.round(46 + s * (255 - 46));
            g = Math.round(204 + s * (214 - 204));
            b = Math.round(64 + s * (10 - 64));
        } else {
            const s = (t - 0.5) * 2;
            r = Math.round(255 + s * (230 - 255));
            g = Math.round(214 + s * (57 - 214));
            b = Math.round(10 + s * (70 - 10));
        }
        const w = 3 + age * 2.5;
        ctx.strokeStyle = `rgba(${r},${g},${b},${alpha.toFixed(2)})`;
        ctx.lineWidth = w * pos0.dscale;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(pos0.sx, pos0.sy);
        ctx.lineTo(pos1.sx, pos1.sy);
        ctx.stroke();
    }
}

// 长传蓄力弧线预览
function drawLobPassPreview() {
    if (lobPassPreview.length < 2) return;
    const n = lobPassPreview.length;
    const maxH = 200;
    for (let i = 0; i < n - 1; i++) {
        if (i % 3 !== 0) continue;
        const p0 = lobPassPreview[i], p1 = lobPassPreview[i + 1];
        if (p0.z < 0 || p1.z < 0) continue;
        const pos0 = project(p0.x, p0.y, p0.z);
        const pos1 = project(p1.x, p1.y, p1.z);
        const zMid = (p0.z + p1.z) / 2;
        const t = Math.min(1, zMid / maxH);
        let r, g, b;
        if (t < 0.35) {
            const s = t / 0.35;
            r = Math.round(46 + s * (138 - 46));
            g = Math.round(204 + s * (228 - 204));
            b = Math.round(64 + s * (52 - 64));
        } else if (t < 0.65) {
            const s = (t - 0.35) / 0.3;
            r = Math.round(138 + s * (255 - 138));
            g = Math.round(228 + s * (214 - 228));
            b = Math.round(52 + s * (10 - 52));
        } else {
            const s = Math.min(1, (t - 0.65) / 0.35);
            r = Math.round(255 + s * (230 - 255));
            g = Math.round(214 + s * (57 - 214));
            b = Math.round(10 + s * (70 - 10));
        }
        const alpha = 0.4 + 0.3 * Math.min(1, zMid / 50);
        ctx.strokeStyle = `rgba(${r},${g},${b},${alpha.toFixed(2)})`;
        ctx.lineWidth = (2.5 + 2 * (zMid / maxH)) * pos0.dscale;
        ctx.lineCap = 'round';
        ctx.setLineDash([6, 4]);
        ctx.beginPath();
        ctx.moveTo(pos0.sx, pos0.sy);
        ctx.lineTo(pos1.sx, pos1.sy);
        ctx.stroke();
        ctx.setLineDash([]);
    }
}

// 球高度指示条（屏幕右侧）
function drawBallHeightBar() {
    const b = mode === 'penalty' ? penBall : ball;
    const z = b.z || 0;
    const maxH = 200;
    const clampedZ = Math.max(0, Math.min(z, maxH));

    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    const barX = cv.width - 62, barW = 18, barH = 260;
    const barY = (cv.height - barH) / 2;

    // 背景面板
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(barX - 14, barY - 32, barW + 50, barH + 64, 8);
    else ctx.rect(barX - 14, barY - 32, barW + 50, barH + 64);
    ctx.fill();

    ctx.fillStyle = '#ccc'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('球高度', barX + barW / 2, barY - 16);

    // 刻度
    [0, 50, 100, 150, 200].forEach(l => {
        const y = barY + barH - (l / maxH) * barH;
        ctx.strokeStyle = '#555'; ctx.lineWidth = 0.5;
        ctx.beginPath(); ctx.moveTo(barX + barW, y); ctx.lineTo(barX + barW + 5, y); ctx.stroke();
        ctx.fillStyle = '#888'; ctx.font = '9px sans-serif'; ctx.textAlign = 'left';
        ctx.fillText(String(l), barX + barW + 7, y + 3);
    });

    // 渐变色：低绿 → 中黄 → 高红
    const grad = ctx.createLinearGradient(0, barY + barH, 0, barY);
    grad.addColorStop(0, '#2ecc40'); grad.addColorStop(0.35, '#8ae234');
    grad.addColorStop(0.65, '#ffd60a'); grad.addColorStop(1, '#e63946');

    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    ctx.fillRect(barX, barY, barW, barH);

    const fillH = (clampedZ / maxH) * barH;
    ctx.fillStyle = grad;
    ctx.fillRect(barX, barY + barH - fillH, barW, fillH);

    ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 1;
    ctx.strokeRect(barX, barY, barW, barH);

    // 当前数值
    const valY = barY + barH - fillH;
    ctx.fillStyle = '#ffd60a'; ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'center';
    const labelY = Math.max(barY + 9, Math.min(valY - 5, barY + barH - 5));
    ctx.fillText(String(Math.round(z)), barX + barW / 2, labelY);

    ctx.restore();
}

// 主渲染调度
function draw() {
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    ctx.fillStyle = '#0a1a0a';
    ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.restore();

    drawStadium();
    drawField();

    if (mode === 'match') drawPlayers();
    else drawPenalty();

    drawBallTrail();
    if (lobPass && lobPass.charging) drawLobPassPreview();
    drawBallObj(mode === 'penalty' ? penBall : ball);
    drawBallHeightBar();

    // 长传蓄力能量条
    if (lobPass && lobPass.charging) drawLobPassPowerBar();

    // 定位球提示
    if (mode === 'match' && setPieceTimer > 0 && setPieceMsg) {
        ctx.fillStyle = '#ffd60a'; ctx.font = 'bold 22px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText(setPieceMsg, FW / 2, project(0, WALL + 30).sy);
    }

    // 暂停
    if (mode === 'match' && state === 'paused') {
        ctx.save();
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(0, 0, cv.width, cv.height);
        ctx.restore();
        ctx.fillStyle = '#fff'; ctx.font = 'bold 48px sans-serif'; ctx.textAlign = 'center';
        const pauseY = CAM_OFFSET_Y + FH * CAM_TILT / 2;
        ctx.fillText('暂停', FW / 2, pauseY);
        ctx.font = '16px sans-serif';
        ctx.fillText('按 P 继续', FW / 2, pauseY + 40);
    }

    // 回放指示
    if (replayActive) drawReplayOverlay();

    // 任意球 UI
    if (freeKick && !freeKick.isAI) drawFreeKickUI();

    // 球门球 UI
    if (goalKick && !goalKick.isAI) drawGoalKickUI();
}

// --- 任意球瞄准 + 力量条 ---
function drawFreeKickUI() {
    const taker = players[freeKick.takerIdx];
    if (!taker) return;

    const s = project(ball.x, ball.y);
    const ex = ball.x + taker.face.x * 180, ey = ball.y + taker.face.y * 180;
    const e = project(ex, ey);

    // 瞄准虚线
    ctx.strokeStyle = 'rgba(255,214,10,.6)'; ctx.lineWidth = 2.5;
    ctx.setLineDash([10, 8]);
    ctx.beginPath(); ctx.moveTo(s.sx, s.sy); ctx.lineTo(e.sx, e.sy); ctx.stroke();
    ctx.setLineDash([]);

    // 箭头
    const ang = Math.atan2(e.sy - s.sy, e.sx - s.sx);
    ctx.fillStyle = 'rgba(255,214,10,.8)';
    ctx.beginPath();
    ctx.moveTo(e.sx, e.sy);
    ctx.lineTo(e.sx - Math.cos(ang - 0.4) * 14, e.sy - Math.sin(ang - 0.4) * 14);
    ctx.lineTo(e.sx - Math.cos(ang + 0.4) * 14, e.sy - Math.sin(ang + 0.4) * 14);
    ctx.closePath(); ctx.fill();

    // 提示文字
    ctx.fillStyle = freeKick.direct ? '#ffd60a' : '#64dcff';
    ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'center';
    if (!freeKick.charging) {
        ctx.fillText(
            freeKick.direct ? '【直接任意球】方向键瞄准 · 按射门蓄力 · 传球直接传出' : '【间接任意球】需先传球再射门 · 建议按传球键传递',
            FW / 2, project(0, WALL + 50).sy
        );
    } else {
        ctx.fillText(
            freeKick.direct ? '再按射门射门！(直接任意球可直接得分)' : '再按射门踢出！(间接任意球直接射门无效)',
            FW / 2, project(0, WALL + 50).sy
        );
    }

    // 力量条
    if (freeKick.charging) {
        ctx.save();
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        const bx = cv.width / 2 - 120, by = cv.height - 70, bw = 240, bh = 18;
        ctx.fillStyle = 'rgba(0,0,0,.7)'; ctx.fillRect(bx - 3, by - 3, bw + 6, bh + 6);
        const pct = freeKick.power / 100;
        const r = Math.floor(pct < 0.5 ? 255 * pct * 2 : 255);
        const g = Math.floor(pct < 0.5 ? 255 : 255 * (1 - (pct - 0.5) * 2));
        ctx.fillStyle = `rgb(${r},${g},0)`;
        ctx.fillRect(bx, by, bw * pct, bh);
        ctx.strokeStyle = 'rgba(255,255,255,.3)'; ctx.lineWidth = 1;
        for (let i = 1; i < 4; i++) { ctx.beginPath(); ctx.moveTo(bx + bw * i / 4, by); ctx.lineTo(bx + bw * i / 4, by + bh); ctx.stroke(); }
        ctx.fillStyle = '#fff'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText(`力量 ${Math.floor(freeKick.power)}%`, cv.width / 2, by - 6);
        ctx.restore();
    }
}

// --- 球门球瞄准 + 力量条 ---
function drawGoalKickUI() {
    const taker = players[goalKick.takerIdx];
    if (!taker) return;

    const s = project(ball.x, ball.y);
    const ex = ball.x + taker.face.x * 380, ey = ball.y + taker.face.y * 180;
    const e = project(ex, ey);

    // 弧线预览
    ctx.strokeStyle = 'rgba(100,220,255,.55)'; ctx.lineWidth = 2.5;
    ctx.setLineDash([9, 7]);
    ctx.beginPath();
    ctx.moveTo(s.sx, s.sy);
    const midX = (s.sx + e.sx) / 2, midY = Math.min(s.sy, e.sy) - 90;
    ctx.quadraticCurveTo(midX, midY, e.sx, e.sy);
    ctx.stroke();
    ctx.setLineDash([]);

    // 落点标记
    ctx.fillStyle = 'rgba(100,220,255,.8)';
    ctx.beginPath(); ctx.arc(e.sx, e.sy, 7, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(e.sx, e.sy, 7, 0, Math.PI * 2); ctx.stroke();

    // 提示
    ctx.fillStyle = '#64dcff'; ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'center';
    if (!goalKick.charging) {
        ctx.fillText('球门球：方向键瞄准 · 射门键蓄力开大脚 · 传球键短传', FW / 2, project(0, WALL + 50).sy);
    } else {
        ctx.fillText('再按射门键开大脚！', FW / 2, project(0, WALL + 50).sy);
    }

    // 力量条
    if (goalKick.charging) {
        ctx.save();
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        const bx = cv.width / 2 - 120, by = cv.height - 70, bw = 240, bh = 18;
        ctx.fillStyle = 'rgba(0,0,0,.7)'; ctx.fillRect(bx - 3, by - 3, bw + 6, bh + 6);
        const pct = goalKick.power / 100;
        const r = Math.floor(pct * 140), g = Math.floor(200 - pct * 60), b = Math.floor(255);
        ctx.fillStyle = `rgb(${r},${g},${b})`;
        ctx.fillRect(bx, by, bw * pct, bh);
        ctx.strokeStyle = 'rgba(255,255,255,.3)'; ctx.lineWidth = 1;
        for (let i = 1; i < 4; i++) { ctx.beginPath(); ctx.moveTo(bx + bw * i / 4, by); ctx.lineTo(bx + bw * i / 4, by + bh); ctx.stroke(); }
        ctx.fillStyle = '#fff'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText(`开球力量 ${Math.floor(goalKick.power)}%`, cv.width / 2, by - 6);
        ctx.restore();
    }
}

function drawLobPassPowerBar() {

// 14-game.js — 游戏流程控制：更新分发、UI 辅助、菜单
// 绿茵对决 · 足球游戏
// =================================================================

// --- UI 辅助 ---
function showMsg(txt, dur) {
    const m = document.getElementById('msg');
    m.textContent = txt; m.className = 'show';
    setTimeout(() => { m.className = ''; }, dur);
}

function showPanel(html) {
    document.getElementById('panel').innerHTML = html;
    document.getElementById('overlay').classList.remove('hidden');
}

function hideOverlay() {
    document.getElementById('overlay').classList.add('hidden');
}

// --- 更新分发 ---
function update(dt) {
    if (mode === 'match') {
        // 回放优先
        if (replayActive) { updateReplay(dt); updateCamera(dt); return; }
        if (state === 'kickoff') {
            goalTimer -= dt;
            if (goalTimer <= 0) state = 'playing';
            recordSnapshot();
            physicsStep(dt, false);
            updateCamera(dt);
            return;
        }
        if (state === 'goal') {
            goalTimer -= dt;
            physicsStep(dt, false);
            updateCamera(dt);
            if (goalTimer <= 0) kickoff();
            return;
        }
        if (state !== 'playing') return;
        timer -= dt;
        if (timer <= 0) { timer = 0; endMatch(); return; }
        recordSnapshot();
        physicsStep(dt, true);
        updateCamera(dt);
    } else {
        updatePenalty(dt);
    }
}

// --- 主循环 ---
function loop(t) {
    if (!lastT) lastT = t;
    let dt = (t - lastT) / 1000;
    lastT = t;
    if (dt > 0.05) dt = 0.05;

    update(dt);

    // HUD 更新
    if (mode === 'match') {
        const m = Math.floor(timer / 60), s = Math.floor(timer % 60);
        document.getElementById('sTime').textContent = m + ':' + String(s).padStart(2, '0');
        const ap = players[activeIdx];
        document.getElementById('activeName').textContent = ap
            ? ('控制：' + (ap.name || '') + ' · ' + (ap.role === 'GK' ? '门将' : ap.role === 'DEF' ? '后卫' : ap.role === 'MID' ? '中场' : '前锋'))
            : '';
    } else {
        document.getElementById('activeName').textContent = '';
    }

    draw();
    requestAnimationFrame(loop);
}

// --- 比赛启动 ---
function startMatch() {
    mode = 'match'; score = [0, 0];
    document.getElementById('sRed').textContent = '0';
    document.getElementById('sBlue').textContent = '0';
    matchTime = selectedTime; timer = matchTime;
    document.getElementById('penHUD').style.display = 'none';
    document.getElementById('btnDebug').style.display = 'flex';
    setupTeams(); kickoff(); hideOverlay();
    startCrowdAmbience();
    if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
        document.getElementById('mctrl').classList.add('show');
    }
}

// --- 调试：重置比赛 ---
function debugResetMatch() {
    score = [0, 0];
    document.getElementById('sRed').textContent = '0';
    document.getElementById('sBlue').textContent = '0';
    timer = matchTime;
    setPiece = null; setPieceTimer = 0; setPieceMsg = '';
    offsideCheck = null;
    players.forEach(p => { p.slide = 0; p.slidePower = 0; p.cards = 0; p.sentOff = false; p.fouls = 0; p.diveTimer = 0; });
    replayActive = false; posHistory = []; replaySnapshots = []; pendingCard = null;
    freeKick = null;
    kickoff();
    showMsg('比赛已重置', 1200);
}

document.getElementById('btnDebug').addEventListener('click', debugResetMatch);

// 回放跳过按钮点击检测
cv.addEventListener('pointerdown', e => {
    if (!replayActive) return;
    const rect = cv.getBoundingClientRect();
    const sx = (e.clientX - rect.left) / rect.width * cv.width;
    const sy = (e.clientY - rect.top) / rect.height * cv.height;
    const btnW = 130, btnH = 44, btnX = cv.width - btnW - 20, btnY = 20;
    if (sx >= btnX && sx <= btnX + btnW && sy >= btnY && sy <= btnY + btnH) {
        e.preventDefault();
        skipReplay();
    }
});

    h += `<button class="btn" data-mode="worldcup" style="width:100%;margin-top:8px;background:linear-gradient(135deg,#ffd60a,#ff8c00);color:#222;font-weight:800">🌍 2026 世界杯 · 争夺大力神杯</button>`;

    // 操作提示
    h += `<div class="keys"><div><b>↑↓←→</b>移动</div><div><b>空格</b>射门</div><div><b>WASD</b>移动</div><div><b>Q</b>长传蓄力</div><div><b>X</b>切换队员</div><div><b>Z</b>疾跑</div><div><b>C</b>铲球</div><div><b>P</b>暂停</div></div>`;
    h += `<div class="small">俱乐部：皇马/巴萨/拜仁/利物浦/曼城/巴黎/尤文/米兰/国米/阿森纳<br>角色色环：<span style="color:#7CFC00">■</span>后卫 · <span style="color:#ffd60a">■</span>中场 · <span style="color:#fff">■</span>前锋<br>移动端：左下摇杆移动，右下按钮传球/射门</div>`;

    showPanel(h);
    updateMatchupPreview();
}

// =================================================================
// 15-main.js — 入口：事件委托 & 启动
// 绿茵对决 · 足球游戏
//
// 菜单按钮通过 overlay 上的事件委托统一处理，兼容动态生成的按钮。
// 支持的 data 属性：data-mode, data-team, data-form, data-time,
//                    data-club, data-wcteam, data-wcact
// =================================================================

// 菜单/按钮事件委托
document.getElementById('overlay').addEventListener('click', e => {
    // 俱乐部选择
    const cb = e.target.closest('[data-club]');
    if (cb) { pickClub(cb.dataset.club); showMenu(); return; }

    // 球队模式切换
    const tc = e.target.closest('[data-team]');
    if (tc) {
        teamMode = tc.dataset.team;
        tc.parentElement.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c === tc));
        if (teamMode === 'club' && !redClub) { rollTeams(); }
        else { redClub = null; blueClub = null; rollTeams(); }
        showMenu();
        return;
    }

    // 阵型
    const f = e.target.closest('[data-form]');
    if (f) {
        selectedFormation = f.dataset.form;
        f.parentElement.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c === f));
        return;
    }

    // 时长
    const t = e.target.closest('[data-time]');
    if (t) {
        selectedTime = parseInt(t.dataset.time);
        t.parentElement.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c === t));
        return;
    }

    // 世界杯：选国家队
    const wct = e.target.closest('[data-wcteam]');
    if (wct) { initWorldCup(wct.dataset.wcteam); return; }

    // 世界杯：操作按钮
    const wca = e.target.closest('[data-wcact]');
    if (wca) {
        const act = wca.dataset.wcact;
        if (act === 'startgroup') { wc.groupRound = 0; showGroupStandings(); }
        else if (act === 'playgroup') playWCGroupMatch();
        else if (act === 'simround') simWCGroupRound();
        else if (act === 'playko') playWCKnockoutMatch();
        else if (act === 'simko') simKnockoutRound();
        else if (act === 'newwc') { wc = null; startWorldCup(); }
        else if (act === 'menu') { wc = null; showMenu(); }
        return;
    }

    // 主菜单按钮
    const btn = e.target.closest('[data-mode]');
    if (!btn) return;
    const m = btn.dataset.mode;
    if (m === 'match') startMatch();
    else if (m === 'penalty') startPenalty();
    else if (m === 'menu') showMenu();
    else if (m === 'worldcup') showWCCover();
});

// 启动
rollTeams();
setupTeams();
requestAnimationFrame(loop);

})();
</script>
